name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only needs to read the code.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t vin-decoder .
      - name: Start it and check /health
        run: |
          docker run -d --name vin -p 8000:8000 vin-decoder
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/health; then exit 0; fi
            sleep 1
          done
          docker logs vin
          exit 1
